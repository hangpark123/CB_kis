<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntTrading Pro | 트레이딩</title>
    <link rel="stylesheet" href="/css/toss_design_system.css">
    <link rel="stylesheet" href="/css/dashboard_modern.css">
    <link rel="stylesheet" href="/css/trading_desk_toss.css">
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
</head>

<body>
    <!-- Toss Style Header (Unified) -->
    <header class="dashboard-header">
        <div class="dashboard-header-content">
            <a href="/dash/" class="logo">
                <span class="logo-icon">⚡</span>
                <span>AntTrading</span>
            </a>

            <div class="search-container">
                <input type="text" class="search-input" id="symbolSearch" placeholder="종목 검색 (예: 삼성전자, 005930)">
                <div id="searchResults" class="search-results" style="display:none;"></div>
            </div>

            <nav class="nav-links">
                <a href="/dash/" class="nav-link">홈</a>
                <a href="/mbti.html" class="nav-link">MBTI 추천</a>
                <a href="/trading_desk.html" class="nav-link active">트레이딩</a>
            </nav>
        </div>
    </header>

    <main class="trading-container">
        <!-- LEFT COLUMN: Chart & Info -->
        <div class="main-column">
            <!-- Stock Header Info -->
            <div class="stock-header-section">
                <div class="sh-title-row">
                    <h1 class="sh-name" id="stockName">삼성전자</h1>
                    <span class="sh-code" id="stockCode">005930</span>
                    <span class="sh-badge" id="stockExchange">KRX</span>
                </div>
                <div class="sh-price-row">
                    <div class="sh-price" id="currentPrice">--</div>
                    <div class="sh-change" id="priceChange">--</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="nav-tabs">
                <div class="nav-tab active">차트</div>
                <div class="nav-tab">종목정보</div>
                <div class="nav-tab">뉴스/공시</div>
                <div class="nav-tab">투자자</div>
            </div>

            <!-- Main Chart -->
            <div class="chart-wrapper">
                <div id="chartContainer" style="width:100%; height:100%;"></div>
            </div>

            <!-- Sub Widgets Grid -->
            <div class="widget-grid">
                <!-- Order Book (Hoga) -->
                <div class="widget-card">
                    <h3 class="heading-md" style="margin-bottom:16px;">호가 (Order Book)</h3>
                    <table class="hoga-table">
                        <tbody id="obAsks">
                            <!-- JS will inject rows here -->
                        </tbody>
                        <tbody id="obBids">
                            <!-- JS will inject rows here -->
                        </tbody>
                    </table>
                </div>

                <!-- AI Analysis -->
                <div class="widget-card">
                    <h3 class="heading-md" style="margin-bottom:16px;">AI 투자 분석</h3>
                    <div id="aiContent" style="color:var(--text-secondary); line-height:1.6;">
                        AI가 실시간으로 분석 중입니다...
                    </div>
                </div>
            </div>

            <!-- Portfolio Section (Moved from footer) -->
            <div class="widget-card" style="height: auto;">
                <h3 class="heading-md" style="margin-bottom:16px;">내 자산 현황</h3>
                <table class="pro-table" style="width:100%;">
                    <thead>
                        <tr
                            style="text-align:left; color:var(--text-secondary); font-size:13px; border-bottom:1px solid var(--border-light);">
                            <th style="padding:8px;">종목명</th>
                            <th>수량</th>
                            <th>평가손익</th>
                        </tr>
                    </thead>
                    <tbody id="portfolioTableBody">
                        <!-- JS injected -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- RIGHT COLUMN: Order Panel (Sticky) -->
        <aside class="side-column">
            <div class="order-panel">
                <!-- Buy/Sell Toggle -->
                <div class="trade-toggle">
                    <div class="toggle-option buy active" onclick="setOrderType('BUY')" id="tabBuy">매수</div>
                    <div class="toggle-option sell" onclick="setOrderType('SELL')" id="tabSell">매도</div>
                </div>

                <!-- Order Type (Limit/Market) -->
                <div class="input-group">
                    <div style="display:flex; gap:8px; margin-bottom:12px;">
                        <label style="display:flex; align-items:center; cursor:pointer;">
                            <input type="radio" name="orderType" value="limit" checked>
                            <span style="font-size:14px; margin-left:6px; font-weight:600;">지정가</span>
                        </label>
                        <label style="display:flex; align-items:center; cursor:pointer;">
                            <input type="radio" name="orderType" value="market">
                            <span
                                style="font-size:14px; margin-left:6px; font-weight:600; color:var(--text-secondary);">시장가</span>
                        </label>
                    </div>
                </div>

                <!-- Price Input -->
                <div class="input-group">
                    <label class="input-label">가격</label>
                    <input type="number" id="orderPrice" class="toss-input" placeholder="0">
                </div>

                <!-- Quantity Input -->
                <div class="input-group">
                    <label class="input-label">수량</label>
                    <input type="number" id="orderQty" class="toss-input" placeholder="0">
                </div>

                <!-- Percentage Buttons -->
                <div class="pct-grid">
                    <button class="pct-btn" onclick="setQtyPct(0.1)">10%</button>
                    <button class="pct-btn" onclick="setQtyPct(0.25)">25%</button>
                    <button class="pct-btn" onclick="setQtyPct(0.5)">50%</button>
                    <button class="pct-btn" onclick="setQtyPct(1.0)">최대</button>
                </div>

                <!-- Summary -->
                <div class="order-summary">
                    <span class="summary-label">주문 총액</span>
                    <span class="summary-value" id="orderTotal">0원</span>
                </div>

                <!-- Action Button -->
                <button id="btnExecute" class="btn-action buy" onclick="executeOrder()">매수하기</button>

                <!-- Account Info -->
                <div style="margin-top:16px; text-align:right; font-size:13px; color:var(--text-secondary);">
                    가능금액: <span class="max-cash-bal" style="font-weight:bold; color:var(--text-primary);">--</span> 원
                </div>
            </div>
        </aside>
    </main>

    <script src="/js/tradingview_main.js?v=404"></script>
</body>

</html>
